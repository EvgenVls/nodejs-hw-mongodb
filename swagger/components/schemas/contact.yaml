type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 667295607bf610661b6c3f3e
  name:
    description: "Contact's name"
    type: string
    example: 'Dmytro Boyko'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380000000002'
  email:
    description: "Contact's email"
    type: string
    example: ivan5@example.com
  isFavourite:
    description: 'The contact is a favorite'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: personal
  userId:
    description: "Contact's user id"
    type: string
    example: 669df2e1653bcb9d1f8e4c58
  photo:
    description: "Link to contact's photo"
    type: string
    example: 'https://res.cloudinary.com/dtdgs6kac/image/upload/v1721716023/goit_nodjs/photo.png'
